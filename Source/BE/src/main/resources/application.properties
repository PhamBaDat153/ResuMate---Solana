spring.application.name=Source code
spring.config.import=optional:file:.env[.properties]

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# Live job providers. Remotive and Arbeitnow are public APIs and need no key.
jobs.providers=${JOBS_PROVIDERS:remotive,arbeitnow}
jobs.remotive.api-url=${REMOTIVE_API_URL:https://remotive.com/api/remote-jobs}
jobs.arbeitnow.api-url=${ARBEITNOW_API_URL:https://www.arbeitnow.com/api/job-board-api}
jobs.api-timeout-ms=${JOB_API_TIMEOUT_MS:10000}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}
